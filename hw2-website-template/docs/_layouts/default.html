<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <style>
    body { max-width: 800px; margin: 2rem auto; padding: 0 1.25rem;
           font: 18px/1.6 system-ui, sans-serif; color: #222; background: #fff; }
    h1, h2, h3 { line-height: 1.25; }
    h3 { border-top: 1px solid #ddd; padding-top: 1rem; }
    a { color: #0645ad; }
    a:focus { outline: 3px solid #bf9000; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>{{ content }}</main>
</body>
</html>
